<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Relay Capture — pairing</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0 auto;
        max-width: 34rem;
        padding: 2rem 1.5rem;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
      p.lede { margin: 0 0 1.5rem; opacity: 0.75; }
      label { display: block; font-weight: 600; margin: 1rem 0 0.25rem; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.5rem 0.6rem;
        border: 1px solid rgba(128, 128, 128, 0.5);
        border-radius: 6px;
        font: inherit;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      button {
        margin-top: 1.25rem;
        padding: 0.55rem 1rem;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #status { min-height: 1.5rem; margin-top: 1rem; }
      #status[data-state="ok"] { color: #059669; }
      #status[data-state="error"] { color: #dc2626; }
      ol { padding-left: 1.2rem; opacity: 0.85; }
    </style>
  </head>
  <body>
    <h1>Pair with Relay</h1>
    <p class="lede">
      Captures are sent to Relay on this computer, over a loopback connection. Nothing is
      sent anywhere else.
    </p>
    <ol>
      <li>Open Relay, then <strong>Settings → Capture</strong>.</li>
      <li>Turn <strong>Browser capture</strong> on.</li>
      <li>Copy the port and pairing token shown there into the fields below.</li>
    </ol>
    <form id="pairing">
      <label for="port">Port</label>
      <input id="port" name="port" type="number" min="1024" max="65535" required />
      <label for="token">Pairing token</label>
      <input id="token" name="token" type="text" autocomplete="off" spellcheck="false" required />
      <button type="submit">Save and test</button>
    </form>
    <p id="status"></p>
    <script type="module" src="options.js"></script>
  </body>
</html>
