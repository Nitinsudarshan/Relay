[package]
name = "relay-native-backend"
version = "0.41.0"
description = "Relay AI Voice and Memory Assistant Rust Backend"
authors = ["Relay Team"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "relay_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-global-shortcut = "2.0"
# Opens a meeting's conferencing link in the user's default browser when
# they press Join on a reminder. `tauri-plugin-shell`'s `open` is deprecated
# in favour of this.
tauri-plugin-opener = "2"
# Writes the OS launch entry behind Settings › Startup › "Launch at login" —
# the registry Run key on Windows, a LaunchAgent on macOS, a .desktop file on
# Linux. Tauri's own plugin rather than three hand-rolled platform paths,
# because the interesting part of this feature is that the setting is finally
# read at all, not the file formats.
tauri-plugin-autostart = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["json", "blocking"] }
cpal = "0.15"
hound = "3.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
whisper-rs = { version = "0.16", optional = true }
enigo = "0.2"
arboard = "3.4"
base64 = "0.22"
keyring = "2.1"
urlencoding = "2.1"
dotenvy = "0.15"
sha2 = "0.10"
pdf-extract = "0.7"
quick-xml = "0.36"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Spike only (`--features onnx-spike`), never in a shipped build. Present so
# `developer::onnx_spike` can prove ONNX Runtime builds, bundles and runs
# inside a real Windows Tauri binary before G6 denoise or T4 turn detection are
# started. Pinned exactly: 2.0 is a release candidate, and a spike that answers
# a packaging question has to answer it about one known version.
ort = { version = "=2.0.0-rc.13", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
] }

[features]
default = ["whisper-local"]
whisper-local = ["dep:whisper-rs"]
# Compiles the ONNX packaging spike's inference call and runs it at launch.
# See docs/spikes/onnx-windows.md. Not part of any shipped configuration.
onnx-spike = ["dep:ort"]

