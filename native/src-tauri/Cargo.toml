[package]
name = "relay-native-backend"
version = "0.1.0"
description = "Relay AI Voice and Memory Assistant Rust Backend"
authors = ["Relay Team"]
edition = "2021"

[lib]
name = "relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-global-shortcut = "2.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["json"] }
cpal = "0.15"
hound = "3.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
whisper-rs = { version = "0.14", optional = true }
enigo = "0.2"
base64 = "0.22"

[features]
# Whisper transcription is what makes recording actually produce text —
# without it every capture (meeting/scribble/chat/universal dictation)
# fails at the STT step with "no local Whisper model configured" no matter
# what's set in Settings, because the code path that reads that setting
# doesn't even exist in the binary. See .cargo/config.toml for how the
# Windows libclang/bindgen build failure that got this disabled is avoided.
default = []
whisper-local = ["dep:whisper-rs"]
