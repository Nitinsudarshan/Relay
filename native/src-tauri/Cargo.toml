[package]
name = "relay-native-backend"
version = "0.25.2"
description = "Relay AI Voice and Memory Assistant Rust Backend"
authors = ["Relay Team"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-global-shortcut = "2.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["json", "blocking"] }
cpal = "0.15"
hound = "3.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
whisper-rs = { version = "0.16", optional = true }
enigo = "0.2"
base64 = "0.22"
keyring = "2.1"
urlencoding = "2.1"
dotenvy = "0.15"
sha2 = "0.10"
pdf-extract = "0.7"
quick-xml = "0.36"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Upstream ships Windows as a zip and every Unix platform as a tarball,
# so the installer has to read both. `zip` already pulls flate2 in for
# deflate; naming it here makes the gzip side explicit rather than
# inherited from another crate's feature choice.
tar = "0.4"
flate2 = "1"

[features]
default = ["whisper-local"]
whisper-local = ["dep:whisper-rs"]

