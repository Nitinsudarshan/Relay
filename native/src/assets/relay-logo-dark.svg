<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- Connector: center-bottom to top-left -->
  <line x1="245" y1="315" x2="145" y2="185" stroke="#e0e0e0" stroke-width="14" stroke-linecap="round"/>
  <line x1="245" y1="315" x2="145" y2="185" stroke="transparent" stroke-width="6" stroke-linecap="round"/>
  <!-- Connector: center-bottom to top-right -->
  <line x1="255" y1="315" x2="340" y2="185" stroke="#e0e0e0" stroke-width="14" stroke-linecap="round"/>
  <line x1="255" y1="315" x2="340" y2="185" stroke="transparent" stroke-width="6" stroke-linecap="round"/>

  <!-- Top-left node (small) -->
  <circle cx="128" cy="170" r="46" stroke="#e0e0e0" stroke-width="14" fill="transparent"/>
  <circle cx="128" cy="170" r="32" stroke="#e0e0e0" stroke-width="7" fill="transparent"/>

  <!-- Top-right node (large) -->
  <circle cx="358" cy="170" r="76" stroke="#e0e0e0" stroke-width="14" fill="transparent"/>
  <circle cx="358" cy="170" r="60" stroke="#e0e0e0" stroke-width="7" fill="transparent"/>

  <!-- Bottom-center node (medium) -->
  <circle cx="250" cy="336" r="58" stroke="#e0e0e0" stroke-width="14" fill="transparent"/>
  <circle cx="250" cy="336" r="42" stroke="#e0e0e0" stroke-width="7" fill="transparent"/>
</svg>
